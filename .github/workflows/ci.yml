name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # swagger spec commit ไว้ในรีโป ถ้า handler เปลี่ยนแล้วลืม gen ใหม่ต้องรู้ตรงนี้
      - name: Swagger docs ตรงกับ handler ไหม
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          swag init -g cmd/server/main.go -o docs --parseInternal --parseDependency
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ ไม่ตรงกับ annotation — รัน swag init แล้ว commit ด้วย"
            exit 1
          }

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_user_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      # เทสต์ชุดนี้พิสูจน์พฤติกรรมของ SQL/GORM จริง (soft delete, unique violation,
      # ILIKE, ORDER BY, transaction rollback) ซึ่ง mock พิสูจน์แทนไม่ได้
      - name: Integration test
        run: go test -tags integration -count=1 ./internal/repository/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
